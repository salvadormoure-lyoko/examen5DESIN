name: Build App (EXE & DEB)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        # Definimos los entornos para Windows y Linux
        include:
          - os: windows-latest
            artifact_name: windows-app
          - os: ubuntu-latest
            artifact_name: linux-app
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout del código
        uses: [actions/checkout](https://github.com)@v4

      - name: Configurar Python
        uses: [actions/setup-python](https://github.com)@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PyInstaller

      # --- PASO PARA WINDOWS (.EXE) ---
      - name: Build EXE (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --windowed --name "calculadora" main.py
        # El ejecutable aparecerá en la carpeta dist/

      # --- PASO PARA LINUX (.DEB) ---
      - name: Build DEB (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. Crear binario base con PyInstaller
          pyinstaller --onefile --name "calculadora" main.py
          
          # 2. Crear estructura de carpetas para el .deb
          mkdir -p pkg/usr/local/bin
          mkdir -p pkg/DEBIAN
          cp dist/calculadora pkg/usr/local/bin/
          
          # 3. Crear archivo de control para Debian
          cat <<EOF > pkg/DEBIAN/control
          Package: mi-aplicacion
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Tu Nombre <tu@email.com>
          Description: Mi aplicacion PySide6 convertida a .deb
          EOF
          
          # 4. Empaquetar
          dpkg-deb --build pkg calculadora.deb
          mv calculadora.deb dist/

      # --- GENERAR ARTIFACT ---
      - name: Subir Artifact
        uses: [actions/upload-artifact](https://github.com/actions/upload-artifact)@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
